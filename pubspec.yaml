name: treninoo
description: My first flutter project with Trenitalia API

version: 1.0.0+1
# android: 8

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.0.11
  flutter_typeahead: ^5.2.0
  cupertino_icons: ^1.0.5
  provider: ^6.0.3
  flutter_bloc: ^9.0.0
  equatable: ^2.0.0
  intl: ^0.19.0
  firebase_core: ^3.11.0
  url_launcher: ^6.0.18
  adaptive_theme: ^3.1.0
  table_calendar: ^3.0.8
  dio: ^5.4.0
  native_dio_adapter: ^1.4.0
  flutter_boxicons: ^3.0.0
  firebase_crashlytics: ^4.3.2
  firebase_analytics: ^11.4.2
  timelines_plus: ^1.0.6
  flutter_widget_from_html_core: ^0.16.0
  syncfusion_flutter_pdfviewer: ^28.2.7
  syncfusion_flutter_core: ^28.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  integration_test:
    sdk: flutter
  
flutter_icons:
  android: false
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/response/

  fonts:
    - family: Cabin
      fonts:
        - asset: fonts/Cabin-Bold.ttf
        - asset: fonts/Cabin-Medium.ttf
        - asset: fonts/Cabin-Regular.ttf
        - asset: fonts/Cabin-SemiBold.ttf
